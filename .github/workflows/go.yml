name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o gvm2excel .
      - uses: actions/upload-artifact@v4
        with:
          name: gvm2excel-linux-amd64
          path: gvm2excel
